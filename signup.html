<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — BloodConnect</title>
    <meta name="description" content="Create your BloodConnect account">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-wrapper">
        <!-- Hero Section -->
        <div class="auth-hero">
            <div class="auth-hero-content">
                <div class="logo-icon">🩸</div>
                <h1>Join BloodConnect</h1>
                <p>Register to become a part of our mission to ensure blood is always available when and where it's
                    needed most.</p>
            </div>
        </div>

        <!-- Signup Form -->
        <div class="auth-form-section">
            <div class="auth-form-card">
                <h2>Create Account</h2>
                <p class="subtitle">Fill in your details to get started</p>

                <form id="signupForm">
                    <div class="form-group">
                        <label for="signupName">Full Name *</label>
                        <input type="text" id="signupName" name="name" class="form-control"
                            placeholder="Enter your full name" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="signupEmail">Email *</label>
                            <input type="email" id="signupEmail" name="email" class="form-control"
                                placeholder="you@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="signupPhone">Phone</label>
                            <input type="tel" id="signupPhone" name="phone" class="form-control"
                                placeholder="9876543210">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupUsername">Username *</label>
                        <input type="text" id="signupUsername" name="username" class="form-control"
                            placeholder="Choose a username" required autocomplete="username">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="signupPassword">Password *</label>
                            <div class="password-wrapper">
                                <input type="password" id="signupPassword" name="password" class="form-control"
                                    placeholder="Min 6 characters" required autocomplete="new-password">
                                <button type="button" class="password-toggle">👁</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="signupConfirm">Confirm Password *</label>
                            <div class="password-wrapper">
                                <input type="password" id="signupConfirm" name="confirmPassword" class="form-control"
                                    placeholder="Repeat password" required autocomplete="new-password">
                                <button type="button" class="password-toggle">👁</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupRole">Register As *</label>
                        <select id="signupRole" name="role" class="form-control" required>
                            <option value="" disabled selected>Select your role</option>
                            <option value="donor">Blood Donor</option>
                            <option value="staff">Hospital Staff</option>
                        </select>
                    </div>

                    <div class="form-group" id="bloodGroupField" style="display:none;">
                        <label for="signupBloodGroup">Blood Group</label>
                        <select id="signupBloodGroup" name="bloodGroup" class="form-control">
                            <option value="">Select blood group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A−</option>
                            <option value="B+">B+</option>
                            <option value="B-">B−</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB−</option>
                            <option value="O+">O+</option>
                            <option value="O-">O−</option>
                        </select>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="#" style="color:var(--red-light);">Terms &
                                Conditions</a></label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
                </form>

                <div style="text-align:center;margin-top:1.5rem;">
                    <p style="font-size:0.85rem;color:var(--text-muted);">
                        Already have an account? <a href="login.html"
                            style="color:var(--red-light);font-weight:600;">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
